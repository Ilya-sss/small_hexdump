[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "small_hexdump"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.optional-dependencies]
tests = [
    "pytest",
]

[project.scripts]
hexdump = "small_hexdump.cli:main"

[tool.maturin]
python-source = "python"
module-name = "small_hexdump._core"
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[dependency-groups]
dev = [
    "maturin>=1.16.0",
]